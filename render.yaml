services:
  - type: web
    name: portfolio
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MYSQL_URL
        sync: false
      - key: MYSQL_SSL
        value: "true"
      - key: CLOUDINARY_URL
        sync: false
